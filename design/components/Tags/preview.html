<!-- @dsCard group="Forms" height=520 subtitle="Built from Combobox: chips inside the field, create on Enter" -->
<!doctype html>
<html>
<head>
<link rel="stylesheet" href="../../tokens/tokens.css">
<link rel="stylesheet" href="../../css/components.css">
<script>document.documentElement.dataset.theme=new URLSearchParams(location.search).get("theme")||document.documentElement.dataset.theme||"light"</script>

<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
html,body{margin:0;background:var(--apui-surface-page)}
.demo{padding:24px;display:grid;gap:28px}
.demo-sec{display:grid;gap:12px}
.demo-h{margin:0;font-size:11px;line-height:16px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--apui-text-muted)}
.demo-row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.demo-row.top{align-items:flex-start}
.demo-matrix{display:grid;gap:10px 12px;align-items:center;justify-items:start}
.demo-k{font-size:12px;line-height:16px;color:var(--apui-text-muted);font-family:var(--apui-font-family-mono)}
.demo-surfaces{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.demo-tile{border-radius:var(--apui-radius-lg);padding:16px;display:grid;gap:10px;align-content:start;border:1px solid var(--apui-border-muted);min-width:0}
.demo-tile[data-s=canvas]{background:var(--apui-surface-page)}
.demo-tile[data-s=default]{background:var(--apui-surface-default)}
.demo-tile[data-s=sunken]{background:var(--apui-surface-sunken)}
.demo-backdrop{position:relative;overflow:hidden;border-radius:var(--apui-radius-lg);background:var(--apui-surface-page);border:1px solid var(--apui-border-muted)}
.demo-backdrop>.blob{position:absolute;pointer-events:none}
.demo-backdrop>.content{position:relative;padding:16px;display:grid;gap:10px}
.demo-cols{display:grid;gap:16px}
</style>
</head>
<body class="ap">
<div class="demo"><section class="demo-sec"><h3 class="demo-h">Tags: Combobox with chips</h3><div class="demo-cols" style="grid-template-columns:repeat(2,minmax(0,1fr));align-items:start"><div><div class="apui-field"><label  data-scope="field" data-part="label">Listing tags</label><div class="apui-input" data-multi><span class="apui-chip">Downtown<button  data-scope="chip" data-part="remove" aria-label="Remove Downtown"><svg class="apui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18" /> <path d="m6 6 12 12" /></svg></button></span><span class="apui-chip" data-color="success">Pet friendly<button  data-scope="chip" data-part="remove" aria-label="Remove Pet friendly"><svg class="apui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18" /> <path d="m6 6 12 12" /></svg></button></span><span class="apui-chip" data-color="info">Rooftop<button  data-scope="chip" data-part="remove" aria-label="Remove Rooftop"><svg class="apui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18" /> <path d="m6 6 12 12" /></svg></button></span><span class="apui-chip" data-color="accent">Under $300k<button  data-scope="chip" data-part="remove" aria-label="Remove Under $300k"><svg class="apui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18" /> <path d="m6 6 12 12" /></svg></button></span><span  data-scope="input" data-part="placeholder">Add a tag…</span></div><span  data-scope="field" data-part="hint">Press Enter to add, Backspace to remove the last tag.</span></div></div><div><div class="apui-field"><label  data-scope="field" data-part="label">Listing tags</label><div class="apui-input is-focus" data-multi><span class="apui-chip">Downtown<button  data-scope="chip" data-part="remove" aria-label="Remove Downtown"><svg class="apui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18" /> <path d="m6 6 12 12" /></svg></button></span><span  data-scope="input" data-part="value">Ga</span></div></div><div class="apui-dropdown-menu" role="listbox" aria-label="" style="margin-top:4px"><div class="is-hover" data-scope="dropdown-menu" data-part="item" role="option"><span  data-scope="dropdown-menu" data-part="check"></span><span  data-scope="dropdown-menu" data-part="text"><mark>Ga</mark>rden</span></div><div  data-scope="dropdown-menu" data-part="item" role="option"><span  data-scope="dropdown-menu" data-part="check"></span><span  data-scope="dropdown-menu" data-part="text"><mark>Ga</mark>rage parking</span></div><div  data-scope="dropdown-menu" data-part="item" role="option" aria-selected="true" aria-checked="true"><span  data-scope="dropdown-menu" data-part="check"><svg class="apui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5" /></svg></span><span  data-scope="dropdown-menu" data-part="text"><mark>Ga</mark>ted community</span></div><hr  data-scope="dropdown-menu" data-part="separator"><div  data-scope="dropdown-menu" data-part="item" data-create><svg class="apui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14" /> <path d="M12 5v14" /></svg><span  data-scope="dropdown-menu" data-part="text">Create tag “Ga”</span></div></div></div></div></section><section class="demo-sec"><h3 class="demo-h">Filter chips (selectable)</h3><div class="demo-row" style="gap:6px"><button class="apui-chip" data-selectable aria-pressed="false">All</button><button class="apui-chip" data-selectable aria-pressed="true">Apartments</button><button class="apui-chip" data-selectable aria-pressed="false">Houses</button><button class="apui-chip" data-selectable aria-pressed="true">Lofts</button><button class="apui-chip" data-selectable aria-pressed="false">Townhouses</button></div></section></div>
</body>
</html>
