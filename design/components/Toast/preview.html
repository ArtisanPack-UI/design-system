<!doctype html>
<html>
<head>
<link rel="stylesheet" href="../../tokens/tokens.css">
<link rel="stylesheet" href="../../css/components.css">
<script>document.documentElement.dataset.theme=new URLSearchParams(location.search).get("theme")||document.documentElement.dataset.theme||"light"</script>

<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
html,body{margin:0;background:var(--apui-surface-page)}
.demo{padding:24px;display:grid;gap:28px}
.demo-sec{display:grid;gap:12px}
.demo-h{margin:0;font-size:11px;line-height:16px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--apui-text-muted)}
.demo-row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.demo-row.top{align-items:flex-start}
.demo-matrix{display:grid;gap:10px 12px;align-items:center;justify-items:start}
.demo-k{font-size:12px;line-height:16px;color:var(--apui-text-muted);font-family:var(--apui-font-family-mono)}
.demo-surfaces{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.demo-tile{border-radius:var(--apui-radius-lg);padding:16px;display:grid;gap:10px;align-content:start;border:1px solid var(--apui-border-muted);min-width:0}
.demo-tile[data-s=canvas]{background:var(--apui-surface-page)}
.demo-tile[data-s=default]{background:var(--apui-surface-default)}
.demo-tile[data-s=sunken]{background:var(--apui-surface-sunken)}
.demo-backdrop{position:relative;overflow:hidden;border-radius:var(--apui-radius-lg);background:var(--apui-surface-page);border:1px solid var(--apui-border-muted)}
.demo-backdrop>.blob{position:absolute;pointer-events:none}
.demo-backdrop>.content{position:relative;padding:16px;display:grid;gap:10px}
.demo-cols{display:grid;gap:16px}
</style>
</head>
<body class="ap">
<div class="demo"><div class="demo-cols" style="grid-template-columns:repeat(2,minmax(0,1fr));align-items:start"><section class="demo-sec"><h3 class="demo-h">Status toasts</h3><div class="apui-toast-region" style="justify-items:start"><div class="apui-toast" role="status" data-color="success"><span  data-scope="toast" data-part="icon"><svg class="apui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10" /> <path d="m9 12 2 2 4-4" /></svg></span><p  data-scope="toast" data-part="title">Order #1042 shipped</p><button class="apui-button" data-variant="ghost" data-color="neutral" data-size="xs" data-icon-only aria-label="Dismiss"><svg class="apui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18" /> <path d="m6 6 12 12" /></svg></button><p  data-scope="toast" data-part="description">Tracking number sent to the customer.</p></div><div class="apui-toast" role="status" data-color="error"><span  data-scope="toast" data-part="icon"><svg class="apui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10" /> <path d="m15 9-6 6" /> <path d="m9 9 6 6" /></svg></span><p  data-scope="toast" data-part="title">Couldn’t publish Tranquil Oaks</p><button class="apui-button" data-variant="ghost" data-color="neutral" data-size="xs" data-icon-only aria-label="Dismiss"><svg class="apui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18" /> <path d="m6 6 12 12" /></svg></button><p  data-scope="toast" data-part="description">Two photos failed to upload.</p><div  data-scope="toast" data-part="actions"><button class="apui-button" data-variant="outline" data-color="neutral" data-size="xs"><span  data-scope="button" data-part="label">Retry</span></button><button class="apui-button" data-variant="ghost" data-size="xs"><span  data-scope="button" data-part="label">View details</span></button></div></div><div class="apui-toast" role="status" data-color="info"><span  data-scope="toast" data-part="icon"><svg class="apui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10" /> <path d="M12 16v-4" /> <path d="M12 8h.01" /></svg></span><p  data-scope="toast" data-part="title">3 new members joined</p><button class="apui-button" data-variant="ghost" data-color="neutral" data-size="xs" data-icon-only aria-label="Dismiss"><svg class="apui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18" /> <path d="m6 6 12 12" /></svg></button><p  data-scope="toast" data-part="description">Design team · just now</p></div><div class="apui-toast" role="status" data-color="warning"><span  data-scope="toast" data-part="icon"><svg class="apui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3" /> <path d="M12 9v4" /> <path d="M12 17h.01" /></svg></span><p  data-scope="toast" data-part="title">Your trial ends in 3 days</p><button class="apui-button" data-variant="ghost" data-color="neutral" data-size="xs" data-icon-only aria-label="Dismiss"><svg class="apui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18" /> <path d="m6 6 12 12" /></svg></button><div  data-scope="toast" data-part="actions"><button class="apui-button" data-variant="solid" data-size="xs"><span  data-scope="button" data-part="label">Upgrade</span></button></div></div></div></section><section class="demo-sec"><h3 class="demo-h">Inverse</h3><div class="apui-toast" role="status" data-variant="inverse"><span  data-scope="toast" data-part="icon"><svg class="apui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="20" height="5" x="2" y="3" rx="1" /> <path d="M4 8v11a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8" /> <path d="M10 12h4" /></svg></span><p  data-scope="toast" data-part="title">Listing archived</p><button class="apui-button" data-variant="ghost" data-color="neutral" data-size="xs" data-icon-only aria-label="Dismiss"><svg class="apui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18" /> <path d="m6 6 12 12" /></svg></button><div  data-scope="toast" data-part="actions"><button class="apui-button" data-variant="link" style="color:var(--apui-text-inverse)" data-size="xs"><span  data-scope="button" data-part="label">Undo</span></button></div></div><h3 class="demo-h" style="margin-top:16px">Glass</h3><div class="demo-backdrop" style="padding:20px;min-height:140px"><span class="blob" style="inset-inline-start:-20px;inset-block-start:-10px;width:140px;height:110px;border-radius:var(--apui-radius-lg);background:var(--apui-steel-400)"></span><span class="blob" style="inset-inline-end:-30px;inset-block-end:-30px;width:150px;height:120px;border-radius:9999px;background:var(--apui-marigold-300)"></span><span class="blob" style="inset-inline-end:40%;inset-block-start:30%;width:60px;height:140px;border-radius:var(--apui-radius-lg);background:var(--apui-gray-800)"></span><div style="position:relative"><div class="apui-toast" role="status" data-color="success" data-surface="glass"><span  data-scope="toast" data-part="icon"><svg class="apui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10" /> <path d="m9 12 2 2 4-4" /></svg></span><p  data-scope="toast" data-part="title">Saved to favorites</p><button class="apui-button" data-variant="ghost" data-color="neutral" data-size="xs" data-icon-only aria-label="Dismiss"><svg class="apui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18" /> <path d="m6 6 12 12" /></svg></button><p  data-scope="toast" data-part="description">Golden Hour Apartments</p></div></div></div></section></div></div>
</body>
</html>
