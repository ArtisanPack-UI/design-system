<!doctype html>
<html>
<head>
<link rel="stylesheet" href="../../tokens/tokens.css">
<link rel="stylesheet" href="../../css/components.css">
<script>document.documentElement.dataset.theme=new URLSearchParams(location.search).get("theme")||document.documentElement.dataset.theme||"light"</script>

<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
html,body{margin:0;background:var(--apui-surface-page)}
.demo{padding:24px;display:grid;gap:28px}
.demo-sec{display:grid;gap:12px}
.demo-h{margin:0;font-size:11px;line-height:16px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--apui-text-muted)}
.demo-row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.demo-row.top{align-items:flex-start}
.demo-matrix{display:grid;gap:10px 12px;align-items:center;justify-items:start}
.demo-k{font-size:12px;line-height:16px;color:var(--apui-text-muted);font-family:var(--apui-font-family-mono)}
.demo-surfaces{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.demo-tile{border-radius:var(--apui-radius-lg);padding:16px;display:grid;gap:10px;align-content:start;border:1px solid var(--apui-border-muted);min-width:0}
.demo-tile[data-s=canvas]{background:var(--apui-surface-page)}
.demo-tile[data-s=default]{background:var(--apui-surface-default)}
.demo-tile[data-s=sunken]{background:var(--apui-surface-sunken)}
.demo-backdrop{position:relative;overflow:hidden;border-radius:var(--apui-radius-lg);background:var(--apui-surface-page);border:1px solid var(--apui-border-muted)}
.demo-backdrop>.blob{position:absolute;pointer-events:none}
.demo-backdrop>.content{position:relative;padding:16px;display:grid;gap:10px}
.demo-cols{display:grid;gap:16px}
</style>
</head>
<body class="ap">
<div class="demo"><section class="demo-sec"><h3 class="demo-h">Full</h3><div class="demo-row" style="justify-content:space-between"><span  data-scope="pagination" data-part="summary">Showing 21–30 of 318 properties</span><nav class="apui-pagination" aria-label="Pagination"><button class="apui-pagination-item" aria-label="Previous page" aria-disabled="true"><svg class="apui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" data-mirror><path d="m15 18-6-6 6-6" /></svg></button><button class="apui-pagination-item">1</button><button class="apui-pagination-item">2</button><button class="apui-pagination-item" aria-current="page">3</button><button class="apui-pagination-item">4</button><button class="apui-pagination-item">5</button><span class="apui-pagination-item" data-ellipsis aria-hidden="true">…</span><button class="apui-pagination-item">32</button><button class="apui-pagination-item" aria-label="Next page"><svg class="apui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" data-mirror><path d="m9 18 6-6-6-6" /></svg></button></nav><div class="demo-row" style="gap:8px"><span  data-scope="pagination" data-part="summary">Rows</span><div style="width:84px"><div class="apui-select"><div class="apui-input" data-size="sm" role="combobox" aria-expanded="false"><span  data-scope="input" data-part="value">10</span><span  data-scope="select" data-part="chevron"><svg class="apui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6" /></svg></span></div></div></div></div></div></section><section class="demo-sec"><h3 class="demo-h">Compact</h3><div class="demo-row"><button class="apui-button" data-variant="outline" data-color="neutral" data-size="sm"><svg class="apui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" data-mirror><path d="m15 18-6-6 6-6" /></svg><span  data-scope="button" data-part="label">Previous</span></button><span  data-scope="pagination" data-part="summary">Page 3 of 32</span><button class="apui-button" data-variant="outline" data-color="neutral" data-size="sm"><span  data-scope="button" data-part="label">Next</span><svg class="apui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" data-mirror><path d="m9 18 6-6-6-6" /></svg></button></div></section></div>
</body>
</html>
