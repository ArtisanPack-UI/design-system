<!doctype html>
<html>
<head>
<link rel="stylesheet" href="../../tokens/tokens.css">
<link rel="stylesheet" href="../../css/components.css">
<script>document.documentElement.dataset.theme=new URLSearchParams(location.search).get("theme")||document.documentElement.dataset.theme||"light"</script>

<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
html,body{margin:0;background:var(--apui-surface-page)}
.demo{padding:24px;display:grid;gap:28px}
.demo-sec{display:grid;gap:12px}
.demo-h{margin:0;font-size:11px;line-height:16px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--apui-text-muted)}
.demo-row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.demo-row.top{align-items:flex-start}
.demo-matrix{display:grid;gap:10px 12px;align-items:center;justify-items:start}
.demo-k{font-size:12px;line-height:16px;color:var(--apui-text-muted);font-family:var(--apui-font-family-mono)}
.demo-surfaces{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.demo-tile{border-radius:var(--apui-radius-lg);padding:16px;display:grid;gap:10px;align-content:start;border:1px solid var(--apui-border-muted);min-width:0}
.demo-tile[data-s=canvas]{background:var(--apui-surface-page)}
.demo-tile[data-s=default]{background:var(--apui-surface-default)}
.demo-tile[data-s=sunken]{background:var(--apui-surface-sunken)}
.demo-backdrop{position:relative;overflow:hidden;border-radius:var(--apui-radius-lg);background:var(--apui-surface-page);border:1px solid var(--apui-border-muted)}
.demo-backdrop>.blob{position:absolute;pointer-events:none}
.demo-backdrop>.content{position:relative;padding:16px;display:grid;gap:10px}
.demo-cols{display:grid;gap:16px}
</style>
</head>
<body class="ap">

idden="true"><circle cx="18" cy="5" r="3" /> <circle cx="6" cy="12" r="3" /> <circle cx="18" cy="19" r="3" /> <line x1="8.59" x2="15.42" y1="13.51" y2="17.49" /> <line x1="15.41" x2="8.59" y1="6.51" y2="10.49" /></svg><span  data-scope="dropdown-menu" data-part="text">Share</span></div><div  data-scope="dropdown-menu" data-part="item" role="menuitem" aria-disabled="true"><svg class="apui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" /> <polyline points="17 8 12 3 7 8" /> <line x1="12" x2="12" y1="3" y2="15" /></svg><span  data-scope="dropdown-menu" data-part="text">Publish (needs photos)</span></div><hr  data-scope="dropdown-menu" data-part="separator"><div  data-scope="dropdown-menu" data-part="label">Show columns</div><div  data-scope="dropdown-menu" data-part="item" role="menuitemcheckbox" aria-checked="true"><span  data-scope="dropdown-menu" data-part="check"><svg class="apui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5" /></svg></span><span  data-scope="dropdown-menu" data-part="text">Price</span></div><div  data-scope="dropdown-menu" data-part="item" role="menuitemcheckbox" aria-checked="false"><span  data-scope="dropdown-menu" data-part="check"></span><span  data-scope="dropdown-menu" data-part="text">Monthly rent</span></div><hr  data-scope="dropdown-menu" data-part="separator"><div  data-scope="dropdown-menu" data-part="item" role="menuitem" data-color="error"><svg class="apui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="20" height="5" x="2" y="3" rx="1" /> <path d="M4 8v11a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8" /> <path d="M10 12h4" /></svg><span  data-scope="dropdown-menu" data-part="text">Archive listing</span></div></div></div></section><section class="demo-sec"><h3 class="demo-h">Account menu</h3><div style="display:grid;gap:6px;justify-items:start"><button class="apui-button" data-variant="ghost" data-color="neutral" data-icon-only aria-label="Account"><svg class="apui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" /> <circle cx="12" cy="7" r="4" /></svg></button><div class="apui-dropdown-menu" role="menu" aria-label="Account" style="min-width:240px"><div style="display:flex;gap:10px;align-items:center;padding:8px 10px"><span class="apui-avatar" data-color="primary" data-size="sm" role="img" aria-label="OR">OR</span><div><div style="font-weight:500">Olivia Rhye</div><div style="font-size:12px;color:var(--apui-text-muted)">olivia@company.com</div></div></div><hr  data-scope="dropdown-menu" data-part="separator"><div  data-scope="dropdown-menu" data-part="item" role="menuitem"><svg class="apui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" /> <circle cx="12" cy="7" r="4" /></svg><span  data-scope="dropdown-menu" data-part="text">Profile</span></div><div  data-scope="dropdown-menu" data-part="item" role="menuitem"><svg class="apui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="20" height="14" x="2" y="5" rx="2" /> <line x1="2" x2="22" y1="10" y2="10" /></svg><span  data-scope="dropdown-menu" data-part="text">Billing</span></div><div  data-scope="dropdown-menu" data-part="item" role="menuitem"><svg class="apui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 8h.01" /> <path d="M12 12h.01" /> <path d="M14 8h.01" /> <path d="M16 12h.01" /> <path d="M18 8h.01" /> <path d="M6 8h.01" /> <path d="M7 16h10" /> <path d="M8 12h.01" /> <rect width="20" height="16" x="2" y="4" rx="2" /></svg><span  data-scope="dropdown-menu" data-part="text">Shortcuts</span><span  data-scope="dropdown-menu" data-part="shortcut">?</span></div><hr  data-scope="dropdown-menu" data-part="separator"><div  data-scope="dropdown-menu" data-part="item" role="menuitem"><svg class="apui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" data-mirror><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" /> <polyline points="16 17 21 12 16 7" /> <line x1="21" x2="9" y1="12" y2="12" /></svg><span  data-scope="dropdown-menu" data-part="text">Log out</span></div></div></div></section><section class="demo-sec"><h3 class="demo-h">Glass surface</h3><div class="demo-backdrop" style="padding:20px"><span class="blob" style="inset-inline-start:-20px;inset-block-start:-10px;width:140px;height:110px;border-radius:var(--apui-radius-lg);background:var(--apui-steel-400)"></span><span class="blob" style="inset-inline-end:-30px;inset-block-end:-30px;width:150px;height:120px;border-radius:9999px;background:var(--apui-marigold-300)"></span><span class="blob" style="inset-inline-end:40%;inset-block-start:30%;width:60px;height:140px;border-radius:var(--apui-radius-lg);background:var(--apui-gray-800)"></span><div style="position:relative;display:grid;gap:6px;justify-items:start"><button class="apui-button" data-variant="outline" data-color="neutral" data-size="sm"><span  data-scope="button" data-part="label">Sort</span><svg class="apui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6" /></svg></button><div class="apui-dropdown-menu" data-surface="glass" role="menu"><div  data-scope="dropdown-menu" data-part="item" role="menuitemradio" aria-checked="true"><span  data-scope="dropdown-menu" data-part="check"><svg class="apui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5" /></svg></span><span  data-scope="dropdown-menu" data-part="text">Newest first</span></div><div  data-scope="dropdown-menu" data-part="item" role="menuitemradio"><span  data-scope="dropdown-menu" data-part="check"></span><span  data-scope="dropdown-menu" data-part="text">Price, low to high</span></div><div  data-scope="dropdown-menu" data-part="item" role="menuitemradio"><span  data-scope="dropdown-menu" data-part="check"></span><span  data-scope="dropdown-menu" data-part="text">Price, high to low</span></div></div></div></div></section></div></div>
</body>
</html>
