<!doctype html>
<html>
<head>
<link rel="stylesheet" href="../../tokens/tokens.css">
<link rel="stylesheet" href="../../css/components.css">
<script>document.documentElement.dataset.theme=new URLSearchParams(location.search).get("theme")||document.documentElement.dataset.theme||"light"</script>

<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
html,body{margin:0;background:var(--apui-surface-page)}
.demo{padding:24px;display:grid;gap:28px}
.demo-sec{display:grid;gap:12px}
.demo-h{margin:0;font-size:11px;line-height:16px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--apui-text-muted)}
.demo-row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.demo-row.top{align-items:flex-start}
.demo-matrix{display:grid;gap:10px 12px;align-items:center;justify-items:start}
.demo-k{font-size:12px;line-height:16px;color:var(--apui-text-muted);font-family:var(--apui-font-family-mono)}
.demo-surfaces{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.demo-tile{border-radius:var(--apui-radius-lg);padding:16px;display:grid;gap:10px;align-content:start;border:1px solid var(--apui-border-muted);min-width:0}
.demo-tile[data-s=canvas]{background:var(--apui-surface-page)}
.demo-tile[data-s=default]{background:var(--apui-surface-default)}
.demo-tile[data-s=sunken]{background:var(--apui-surface-sunken)}
.demo-backdrop{position:relative;overflow:hidden;border-radius:var(--apui-radius-lg);background:var(--apui-surface-page);border:1px solid var(--apui-border-muted)}
.demo-backdrop>.blob{position:absolute;pointer-events:none}
.demo-backdrop>.content{position:relative;padding:16px;display:grid;gap:10px}
.demo-cols{display:grid;gap:16px}
</style>
</head>
<body class="ap">
<div class="demo"><section class="demo-sec"><h3 class="demo-h">Breadcrumbs, title, description, actions, tabs</h3><div class="apui-page-header"><nav aria-label="Breadcrumb"><ol class="apui-breadcrumbs"><li><a href="#">Apexify</a></li><li><span  data-scope="breadcrumbs" data-part="sep" aria-hidden="true"><svg class="apui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" data-mirror><path d="m9 18 6-6-6-6" /></svg></span><span aria-current="page">Dashboard</span></li></ol></nav><div  data-scope="page-header" data-part="row"><div><h1  data-scope="page-header" data-part="title">Dashboard</h1><p  data-scope="page-header" data-part="description">Income, profit and transactions across all stores.</p></div><div  data-scope="page-header" data-part="actions"><button class="apui-button" data-variant="outline" data-color="neutral" data-size="sm"><svg class="apui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2v4" /> <path d="M16 2v4" /> <rect width="18" height="18" x="3" y="4" rx="2" /> <path d="M3 10h18" /></svg><span  data-scope="button" data-part="label">28 Aug – 15 Dec, 2024</span></button><button class="apui-button" data-variant="outline" data-color="neutral" data-size="sm"><svg class="apui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3" /></svg><span  data-scope="button" data-part="label">Filter</span></button><button class="apui-button" data-variant="solid" data-size="sm"><svg class="apui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18" cy="5" r="3" /> <circle cx="6" cy="12" r="3" /> <circle cx="18" cy="19" r="3" /> <line x1="8.59" x2="15.42" y1="13.51" y2="17.49" /> <line x1="15.41" x2="8.59" y1="6.51" y2="10.49" /></svg><span  data-scope="button" data-part="label">Share</span></button></div></div><div class="apui-tabs" data-variant="underline"><div  data-scope="tabs" data-part="list" role="tablist"><button  data-scope="tabs" data-part="trigger" role="tab" aria-selected="true">Overview</button><button  data-scope="tabs" data-part="trigger" role="tab" aria-selected="false">Notifications<span  data-scope="tabs" data-part="count">4</span></button><button  data-scope="tabs" data-part="trigger" role="tab" aria-selected="false">Trade history</button></div></div></div></section><section class="demo-sec"><h3 class="demo-h">With status meta</h3><div class="apui-page-header"><div  data-scope="page-header" data-part="row"><div><div  data-scope="page-header" data-part="meta"><span class="apui-badge" data-color="warning"><span  data-scope="badge" data-part="dot"></span>Draft</span><span style="font-size:12px;color:var(--apui-text-muted)">Edited 20 min ago</span></div><h1  data-scope="page-header" data-part="title" style="margin-top:6px">The Grove at Greenfield</h1></div><div  data-scope="page-header" data-part="actions"><button class="apui-button" data-variant="ghost" data-color="neutral" data-size="sm"><svg class="apui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0" /> <circle cx="12" cy="12" r="3" /></svg><span  data-scope="button" data-part="label">Preview</span></button><button class="apui-button" data-variant="solid" data-size="sm"><span  data-scope="button" data-part="label">Publish</span></button></div></div></div></section></div>
</body>
</html>
