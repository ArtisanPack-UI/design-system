<!-- @dsCard group="Data display" height=380 subtitle="Initials or image, status dot, groups" -->
<!doctype html>
<html>
<head>
<link rel="stylesheet" href="../../tokens/tokens.css">
<link rel="stylesheet" href="../../css/components.css">
<script>document.documentElement.dataset.theme=new URLSearchParams(location.search).get("theme")||document.documentElement.dataset.theme||"light"</script>

<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
html,body{margin:0;background:var(--apui-surface-page)}
.demo{padding:24px;display:grid;gap:28px}
.demo-sec{display:grid;gap:12px}
.demo-h{margin:0;font-size:11px;line-height:16px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--apui-text-muted)}
.demo-row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.demo-row.top{align-items:flex-start}
.demo-matrix{display:grid;gap:10px 12px;align-items:center;justify-items:start}
.demo-k{font-size:12px;line-height:16px;color:var(--apui-text-muted);font-family:var(--apui-font-family-mono)}
.demo-surfaces{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.demo-tile{border-radius:var(--apui-radius-lg);padding:16px;display:grid;gap:10px;align-content:start;border:1px solid var(--apui-border-muted);min-width:0}
.demo-tile[data-s=canvas]{background:var(--apui-surface-page)}
.demo-tile[data-s=default]{background:var(--apui-surface-default)}
.demo-tile[data-s=sunken]{background:var(--apui-surface-sunken)}
.demo-backdrop{position:relative;overflow:hidden;border-radius:var(--apui-radius-lg);background:var(--apui-surface-page);border:1px solid var(--apui-border-muted)}
.demo-backdrop>.blob{position:absolute;pointer-events:none}
.demo-backdrop>.content{position:relative;padding:16px;display:grid;gap:10px}
.demo-cols{display:grid;gap:16px}
</style>
</head>
<body class="ap">
<div class="demo"><section class="demo-sec"><h3 class="demo-h">Sizes (match control heights)</h3><div class="demo-row"><span class="apui-avatar" data-color="primary" data-size="xs" role="img" aria-label="OR">OR</span><span class="apui-avatar" data-color="primary" data-size="sm" role="img" aria-label="OR">OR</span><span class="apui-avatar" data-color="primary" data-size="md" role="img" aria-label="OR">OR</span><span class="apui-avatar" data-color="primary" data-size="lg" role="img" aria-label="OR">OR</span><span class="apui-avatar" data-color="primary" data-size="xl" role="img" aria-label="OR">OR</span></div></section><section class="demo-sec"><h3 class="demo-h">Initials by color, status, square</h3><div class="demo-row"><span class="apui-avatar" data-color="primary" role="img" aria-label="OR">OR</span><span class="apui-avatar" data-color="success" role="img" aria-label="PB">PB</span><span class="apui-avatar" data-color="info" role="img" aria-label="LS">LS</span><span class="apui-avatar" data-color="accent" role="img" aria-label="DW">DW</span><span class="apui-avatar" data-color="secondary" role="img" aria-label="CG">CG</span><span class="apui-avatar" data-color="error" role="img" aria-label="DR">DR</span><span class="apui-avatar" data-color="primary" role="img" aria-label="OR">OR<span  data-scope="avatar" data-part="status" data-status="online"></span></span><span class="apui-avatar" data-color="success" role="img" aria-label="PB">PB<span  data-scope="avatar" data-part="status" data-status="away"></span></span><span class="apui-avatar" data-color="info" role="img" aria-label="LS">LS<span  data-scope="avatar" data-part="status" data-status="offline"></span></span><span class="apui-avatar" data-color="neutral" data-shape="square" role="img" aria-label="AX">AX</span></div></section><section class="demo-sec"><h3 class="demo-h">Group</h3><div class="demo-row"><span class="apui-avatar-group"><span class="apui-avatar" data-color="primary" data-size="sm" role="img" aria-label="OR">OR</span><span class="apui-avatar" data-color="success" data-size="sm" role="img" aria-label="PB">PB</span><span class="apui-avatar" data-color="info" data-size="sm" role="img" aria-label="LS">LS</span><span class="apui-avatar" data-color="accent" data-size="sm" role="img" aria-label="DW">DW</span><span class="apui-avatar" data-size="sm" data-color="neutral">+4</span></span><span style="font-size:13px;color:var(--apui-text-muted)">+8 people</span></div></section></div>
</body>
</html>
