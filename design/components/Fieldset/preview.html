<!doctype html>
<html>
<head>
<link rel="stylesheet" href="../../tokens/tokens.css">
<link rel="stylesheet" href="../../css/components.css">
<script>document.documentElement.dataset.theme=new URLSearchParams(location.search).get("theme")||document.documentElement.dataset.theme||"light"</script>

<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
html,body{margin:0;background:var(--apui-surface-page)}
.demo{padding:24px;display:grid;gap:28px}
.demo-sec{display:grid;gap:12px}
.demo-h{margin:0;font-size:11px;line-height:16px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--apui-text-muted)}
.demo-row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.demo-row.top{align-items:flex-start}
.demo-matrix{display:grid;gap:10px 12px;align-items:center;justify-items:start}
.demo-k{font-size:12px;line-height:16px;color:var(--apui-text-muted);font-family:var(--apui-font-family-mono)}
.demo-surfaces{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.demo-tile{border-radius:var(--apui-radius-lg);padding:16px;display:grid;gap:10px;align-content:start;border:1px solid var(--apui-border-muted);min-width:0}
.demo-tile[data-s=canvas]{background:var(--apui-surface-page)}
.demo-tile[data-s=default]{background:var(--apui-surface-default)}
.demo-tile[data-s=sunken]{background:var(--apui-surface-sunken)}
.demo-backdrop{position:relative;overflow:hidden;border-radius:var(--apui-radius-lg);background:var(--apui-surface-page);border:1px solid var(--apui-border-muted)}
.demo-backdrop>.blob{position:absolute;pointer-events:none}
.demo-backdrop>.content{position:relative;padding:16px;display:grid;gap:10px}
.demo-cols{display:grid;gap:16px}
</style>
</head>
<body class="ap">
<div class="demo"><div class="demo-cols" style="grid-template-columns:repeat(2,minmax(0,1fr));align-items:start"><section class="demo-sec"><h3 class="demo-h">Default (panel)</h3><fieldset class="apui-fieldset"><legend  data-scope="fieldset" data-part="legend"><span  data-scope="fieldset" data-part="title">Contact</span><span  data-scope="fieldset" data-part="description">Who buyers and renters should reach.</span></legend><div  data-scope="fieldset" data-part="row"><div class="apui-field"><label  data-scope="field" data-part="label">Full name</label><div class="apui-input"><span  data-scope="input" data-part="value">Olivia Rhye</span></div></div><div class="apui-field"><label  data-scope="field" data-part="label">Email</label><div class="apui-input"><span  data-scope="input" data-part="icon"><svg class="apui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="20" height="16" x="2" y="4" rx="2" /> <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7" /></svg></span><span  data-scope="input" data-part="value">olivia@company.com</span></div></div></div><div class="apui-field"><label  data-scope="field" data-part="label">Phone <span  data-scope="field" data-part="optional">(optional)</span></label><div class="apui-input"><span  data-scope="input" data-part="value">+34 612 345 678</span></div></div></fieldset></section><section class="demo-sec"><h3 class="demo-h">Divided · plain and disabled</h3><fieldset class="apui-fieldset" data-variant="divided"><legend  data-scope="fieldset" data-part="legend"><span  data-scope="fieldset" data-part="title">Billing address</span></legend><label class="apui-choice" data-type="checkbox" data-state="checked"><span  data-scope="choice" data-part="box"><input type="checkbox" checked><svg class="apui-icon" data-scope="choice" data-part="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5" /></svg><svg class="apui-icon" data-scope="choice" data-part="mixed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14" /></svg></span><span  data-scope="choice" data-part="label">Same as property address</span></label></fieldset><fieldset class="apui-fieldset" data-variant="plain" disabled data-disabled style="margin-top:16px"><legend  data-scope="fieldset" data-part="legend"><span  data-scope="fieldset" data-part="title">Payout account</span><span  data-scope="fieldset" data-part="description">Locked while a payout is processing.</span></legend><div  data-scope="fieldset" data-part="row"><div class="apui-field" data-disabled><label  data-scope="field" data-part="label">IBAN</label><div class="apui-input"><span  data-scope="input" data-part="value">ES91 •••• •••• 1332</span></div></div><div class="apui-field" data-disabled><label  data-scope="field" data-part="label">Account holder</label><div class="apui-input"><span  data-scope="input" data-part="value">Olivia Rhye</span></div></div></div></fieldset></section></div></div>
</body>
</html>
