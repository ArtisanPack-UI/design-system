<!doctype html>
<html>
<head>
<link rel="stylesheet" href="../../tokens/tokens.css">
<link rel="stylesheet" href="../../css/components.css">
<script>document.documentElement.dataset.theme=new URLSearchParams(location.search).get("theme")||document.documentElement.dataset.theme||"light"</script>

<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
html,body{margin:0;background:var(--apui-surface-page)}
.demo{padding:24px;display:grid;gap:28px}
.demo-sec{display:grid;gap:12px}
.demo-h{margin:0;font-size:11px;line-height:16px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--apui-text-muted)}
.demo-row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.demo-row.top{align-items:flex-start}
.demo-matrix{display:grid;gap:10px 12px;align-items:center;justify-items:start}
.demo-k{font-size:12px;line-height:16px;color:var(--apui-text-muted);font-family:var(--apui-font-family-mono)}
.demo-surfaces{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.demo-tile{border-radius:var(--apui-radius-lg);padding:16px;display:grid;gap:10px;align-content:start;border:1px solid var(--apui-border-muted);min-width:0}
.demo-tile[data-s=canvas]{background:var(--apui-surface-page)}
.demo-tile[data-s=default]{background:var(--apui-surface-default)}
.demo-tile[data-s=sunken]{background:var(--apui-surface-sunken)}
.demo-backdrop{position:relative;overflow:hidden;border-radius:var(--apui-radius-lg);background:var(--apui-surface-page);border:1px solid var(--apui-border-muted)}
.demo-backdrop>.blob{position:absolute;pointer-events:none}
.demo-backdrop>.content{position:relative;padding:16px;display:grid;gap:10px}
.demo-cols{display:grid;gap:16px}
</style>
</head>
<body class="ap">
<div class="demo"><section class="demo-sec"><h3 class="demo-h">States</h3><div class="demo-cols" style="grid-template-columns:repeat(3,minmax(0,1fr))"><div class="apui-field"><label  data-scope="field" data-part="label">Country</label><div class="apui-select"><div class="apui-input" role="combobox" aria-expanded="false"><span  data-scope="input" data-part="placeholder">Select a country</span><span  data-scope="select" data-part="chevron"><svg class="apui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6" /></svg></span></div></div><span  data-scope="field" data-part="hint">Placeholder</span></div><div class="apui-field"><label  data-scope="field" data-part="label">Country</label><div class="apui-select"><div class="apui-input is-hover" role="combobox" aria-expanded="false"><span  data-scope="input" data-part="value">United States</span><span  data-scope="select" data-part="chevron"><svg class="apui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6" /></svg></span></div></div><span  data-scope="field" data-part="hint">Hover</span></div><div class="apui-field"><label  data-scope="field" data-part="label">Country</label><div class="apui-select"><div class="apui-input is-focus" role="combobox" aria-expanded="false"><span  data-scope="input" data-part="value">United States</span><span  data-scope="select" data-part="chevron"><svg class="apui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6" /></svg></span></div></div><span  data-scope="field" data-part="hint">Focus</span></div><div class="apui-field" data-invalid><label  data-scope="field" data-part="label">Property type</label><div class="apui-select"><div class="apui-input" data-invalid role="combobox" aria-expanded="false"><span  data-scope="input" data-part="placeholder">Select a type</span><span  data-scope="select" data-part="chevron"><svg class="apui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6" /></svg></span></div></div><span  data-scope="field" data-part="error"><svg class="apui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10" /> <line x1="12" x2="12" y1="8" y2="12" /> <line x1="12" x2="12.01" y1="16" y2="16" /></svg>Choose a property type.</span></div><div class="apui-field" data-disabled><label  data-scope="field" data-part="label">Currency</label><div class="apui-select"><div class="apui-input" role="combobox" aria-expanded="false"><span  data-scope="input" data-part="value">USD — US dollar</span><span  data-scope="select" data-part="chevron"><svg class="apui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6" /></svg></span></div></div><span  data-scope="field" data-part="hint">Disabled</span></div><div class="apui-field"><label  data-scope="field" data-part="label">Sort by</label><div class="apui-select"><div class="apui-input" data-size="sm" role="combobox" aria-expanded="false"><span  data-scope="input" data-part="icon"><svg class="apui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21 16-4 4-4-4" /> <path d="M17 20V4" /> <path d="m3 8 4-4 4 4" /> <path d="M7 4v16" /></svg></span><span  data-scope="input" data-part="value">Newest first</span><span  data-scope="select" data-part="chevron"><svg class="apui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6" /></svg></span></div></div><span  data-scope="field" data-part="hint">Size sm, leading icon</span></div></div></section><section class="demo-sec"><h3 class="demo-h">Open listbox</h3><div style="max-width:320px"><div class="apui-field"><label  data-scope="field" data-part="label">Country</label><div class="apui-select"><div class="apui-input is-focus" role="combobox" aria-expanded="false"><span  data-scope="input" data-part="value">United States</span><span  data-scope="select" data-part="chevron"><svg class="apui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6" /></svg></span></div></div><div class="apui-dropdown-menu" role="listbox" style="width:100%;margin-top:4px"><div  data-scope="dropdown-menu" data-part="item" role="option"><span  data-scope="dropdown-menu" data-part="check"></span><span  data-scope="dropdown-menu" data-part="text">Canada</span></div><div class="is-hover" data-scope="dropdown-menu" data-part="item" role="option"><span  data-scope="dropdown-menu" data-part="check"></span><span  data-scope="dropdown-menu" data-part="text">Mexico</span></div><div  data-scope="dropdown-menu" data-part="item" role="option" aria-checked="true" aria-selected="true"><span  data-scope="dropdown-menu" data-part="check"><svg class="apui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5" /></svg></span><span  data-scope="dropdown-menu" data-part="text">United States</span></div><div  data-scope="dropdown-menu" data-part="item" role="option" aria-disabled="true"><span  data-scope="dropdown-menu" data-part="check"></span><span  data-scope="dropdown-menu" data-part="text">Other (unavailable)</span></div></div></div></div></section></div>
</body>
</html>
