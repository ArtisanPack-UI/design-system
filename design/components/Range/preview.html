<!-- @dsCard group="Forms" height=460 subtitle="Slider for one value or a range" -->
<!doctype html>
<html>
<head>
<link rel="stylesheet" href="../../tokens/tokens.css">
<link rel="stylesheet" href="../../css/components.css">
<script>document.documentElement.dataset.theme=new URLSearchParams(location.search).get("theme")||document.documentElement.dataset.theme||"light"</script>

<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
html,body{margin:0;background:var(--apui-surface-page)}
.demo{padding:24px;display:grid;gap:28px}
.demo-sec{display:grid;gap:12px}
.demo-h{margin:0;font-size:11px;line-height:16px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--apui-text-muted)}
.demo-row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.demo-row.top{align-items:flex-start}
.demo-matrix{display:grid;gap:10px 12px;align-items:center;justify-items:start}
.demo-k{font-size:12px;line-height:16px;color:var(--apui-text-muted);font-family:var(--apui-font-family-mono)}
.demo-surfaces{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.demo-tile{border-radius:var(--apui-radius-lg);padding:16px;display:grid;gap:10px;align-content:start;border:1px solid var(--apui-border-muted);min-width:0}
.demo-tile[data-s=canvas]{background:var(--apui-surface-page)}
.demo-tile[data-s=default]{background:var(--apui-surface-default)}
.demo-tile[data-s=sunken]{background:var(--apui-surface-sunken)}
.demo-backdrop{position:relative;overflow:hidden;border-radius:var(--apui-radius-lg);background:var(--apui-surface-page);border:1px solid var(--apui-border-muted)}
.demo-backdrop>.blob{position:absolute;pointer-events:none}
.demo-backdrop>.content{position:relative;padding:16px;display:grid;gap:10px}
.demo-cols{display:grid;gap:16px}
</style>
</head>
<body class="ap">
<div class="demo"><section class="demo-sec"><h3 class="demo-h">Single · with value bubble · focus</h3><div class="demo-cols" style="grid-template-columns:repeat(2,minmax(0,1fr));align-items:start"><div class="apui-field"><label  data-scope="field" data-part="label">Search radius</label><div class="apui-range" style="--apui-_pct:40%"><div  data-scope="range" data-part="track"><div  data-scope="range" data-part="fill"></div><span  data-scope="range" data-part="thumb" role="slider" tabindex="0"></span></div></div><div  data-scope="range" data-part="ticks"><span>0 km</span><span>25 km</span><span>50 km</span></div></div><div class="apui-field"><label  data-scope="field" data-part="label">Search radius</label><div style="padding-top:28px"><div class="apui-range" style="--apui-_pct:64%"><div  data-scope="range" data-part="track"><div  data-scope="range" data-part="fill"></div><span class="is-focus" data-scope="range" data-part="thumb" role="slider" tabindex="0"><span  data-scope="range" data-part="bubble">32 km</span></span></div></div></div></div></div></section><section class="demo-sec"><h3 class="demo-h">Range (two thumbs)</h3><div class="demo-cols" style="grid-template-columns:repeat(2,minmax(0,1fr));align-items:start"><div class="apui-field"><label  data-scope="field" data-part="label">Price</label><div style="padding-top:28px"><div class="apui-range" style="--apui-_pct:70%;--apui-_from:25%"><div  data-scope="range" data-part="track"><div  data-scope="range" data-part="fill"></div><span  data-scope="range" data-part="thumb" data-from role="slider" tabindex="0"><span  data-scope="range" data-part="bubble">$200k</span></span><span  data-scope="range" data-part="thumb" role="slider" tabindex="0"><span  data-scope="range" data-part="bubble">$450k</span></span></div></div></div><div  data-scope="range" data-part="ticks"><span>$100k</span><span>$700k</span></div></div><div class="apui-field"><label  data-scope="field" data-part="label">Bedrooms</label><div class="apui-range" style="--apui-_pct:60%;--apui-_from:20%"><div  data-scope="range" data-part="track"><div  data-scope="range" data-part="fill"></div><span  data-scope="range" data-part="thumb" data-from role="slider" tabindex="0"></span><span  data-scope="range" data-part="thumb" role="slider" tabindex="0"></span></div></div><div  data-scope="range" data-part="ticks"><span>Studio</span><span>1</span><span>2</span><span>3</span><span>4</span><span>5+</span></div></div></div></section><section class="demo-sec"><h3 class="demo-h">Colors · small · disabled</h3><div class="demo-cols" style="grid-template-columns:repeat(3,minmax(0,1fr));align-items:start"><div class="apui-range" data-color="success" style="--apui-_pct:80%"><div  data-scope="range" data-part="track"><div  data-scope="range" data-part="fill"></div><span  data-scope="range" data-part="thumb" role="slider" tabindex="0"></span></div></div><div class="apui-range" data-size="sm" style="--apui-_pct:30%"><div  data-scope="range" data-part="track"><div  data-scope="range" data-part="fill"></div><span  data-scope="range" data-part="thumb" role="slider" tabindex="0"></span></div></div><div class="apui-range" data-disabled style="--apui-_pct:50%"><div  data-scope="range" data-part="track"><div  data-scope="range" data-part="fill"></div><span  data-scope="range" data-part="thumb" role="slider" tabindex="0"></span></div></div></div></section></div>
</body>
</html>
