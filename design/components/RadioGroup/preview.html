<!doctype html>
<html>
<head>
<link rel="stylesheet" href="../../tokens/tokens.css">
<link rel="stylesheet" href="../../css/components.css">
<script>document.documentElement.dataset.theme=new URLSearchParams(location.search).get("theme")||document.documentElement.dataset.theme||"light"</script>

<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
html,body{margin:0;background:var(--apui-surface-page)}
.demo{padding:24px;display:grid;gap:28px}
.demo-sec{display:grid;gap:12px}
.demo-h{margin:0;font-size:11px;line-height:16px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--apui-text-muted)}
.demo-row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.demo-row.top{align-items:flex-start}
.demo-matrix{display:grid;gap:10px 12px;align-items:center;justify-items:start}
.demo-k{font-size:12px;line-height:16px;color:var(--apui-text-muted);font-family:var(--apui-font-family-mono)}
.demo-surfaces{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.demo-tile{border-radius:var(--apui-radius-lg);padding:16px;display:grid;gap:10px;align-content:start;border:1px solid var(--apui-border-muted);min-width:0}
.demo-tile[data-s=canvas]{background:var(--apui-surface-page)}
.demo-tile[data-s=default]{background:var(--apui-surface-default)}
.demo-tile[data-s=sunken]{background:var(--apui-surface-sunken)}
.demo-backdrop{position:relative;overflow:hidden;border-radius:var(--apui-radius-lg);background:var(--apui-surface-page);border:1px solid var(--apui-border-muted)}
.demo-backdrop>.blob{position:absolute;pointer-events:none}
.demo-backdrop>.content{position:relative;padding:16px;display:grid;gap:10px}
.demo-cols{display:grid;gap:16px}
</style>
</head>

" data-state="checked"><span  data-scope="choice" data-part="box"><input type="radio" checked><span  data-scope="choice" data-part="dot"></span></span><span  data-scope="choice" data-part="label">Monthly</span></label><label class="apui-choice" data-type="radio" data-state="unchecked"><span  data-scope="choice" data-part="box"><input type="radio"><span  data-scope="choice" data-part="dot"></span></span><span  data-scope="choice" data-part="label">Quarterly</span></label><label class="apui-choice" data-type="radio" data-state="unchecked"><span  data-scope="choice" data-part="box"><input type="radio"><span  data-scope="choice" data-part="dot"></span></span><span  data-scope="choice" data-part="label">Yearly</span></label></div></fieldset></section><section class="demo-sec"><h3 class="demo-h">Cards</h3><fieldset class="apui-radio-group" data-variant="cards"><legend  data-scope="radio-group" data-part="legend">Plan</legend><div  data-scope="radio-group" data-part="items"><label class="apui-choice" data-type="radio" data-state="unchecked"><span  data-scope="choice" data-part="box"><input type="radio"><span  data-scope="choice" data-part="dot"></span></span><span  data-scope="choice" data-part="label">Starter</span><span  data-scope="choice" data-part="description">Up to 5 listings</span><span  data-scope="choice" data-part="meta">$0 / month</span></label><label class="apui-choice" data-type="radio" data-state="checked"><span  data-scope="choice" data-part="box"><input type="radio" checked><span  data-scope="choice" data-part="dot"></span></span><span  data-scope="choice" data-part="label">Growth</span><span  data-scope="choice" data-part="description">Up to 50 listings and analytics</span><span  data-scope="choice" data-part="meta">$39 / month</span></label><label class="apui-choice" data-type="radio" data-state="unchecked"><span  data-scope="choice" data-part="box"><input type="radio"><span  data-scope="choice" data-part="dot"></span></span><span  data-scope="choice" data-part="label">Portfolio</span><span  data-scope="choice" data-part="description">Unlimited listings, team seats</span><span  data-scope="choice" data-part="meta">$129 / month</span></label></div></fieldset></section></div>
</body>
</html>
