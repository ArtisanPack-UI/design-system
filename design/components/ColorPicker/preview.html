<!-- @dsCard group="Forms" height=520 subtitle="Field trigger, saturation area, hue and opacity, swatches" -->
<!doctype html>
<html>
<head>
<link rel="stylesheet" href="../../tokens/tokens.css">
<link rel="stylesheet" href="../../css/components.css">
<script>document.documentElement.dataset.theme=new URLSearchParams(location.search).get("theme")||document.documentElement.dataset.theme||"light"</script>

<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
html,body{margin:0;background:var(--apui-surface-page)}
.demo{padding:24px;display:grid;gap:28px}
.demo-sec{display:grid;gap:12px}
.demo-h{margin:0;font-size:11px;line-height:16px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--apui-text-muted)}
.demo-row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.demo-row.top{align-items:flex-start}
.demo-matrix{display:grid;gap:10px 12px;align-items:center;justify-items:start}
.demo-k{font-size:12px;line-height:16px;color:var(--apui-text-muted);font-family:var(--apui-font-family-mono)}
.demo-surfaces{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.demo-tile{border-radius:var(--apui-radius-lg);padding:16px;display:grid;gap:10px;align-content:start;border:1px solid var(--apui-border-muted);min-width:0}
.demo-tile[data-s=canvas]{background:var(--apui-surface-page)}
.demo-tile[data-s=default]{background:var(--apui-surface-default)}
.demo-tile[data-s=sunken]{background:var(--apui-surface-sunken)}
.demo-backdrop{position:relative;overflow:hidden;border-radius:var(--apui-radius-lg);background:var(--apui-surface-page);border:1px solid var(--apui-border-muted)}
.demo-backdrop>.blob{position:absolute;pointer-events:none}
.demo-backdrop>.content{position:relative;padding:16px;display:grid;gap:10px}
.demo-cols{display:grid;gap:16px}
</style>
</head>
<body class="ap">
<div class="demo"><div class="demo-cols" style="grid-template-columns:repeat(2,minmax(0,1fr));align-items:start"><section class="demo-sec"><h3 class="demo-h">Field</h3><div style="display:grid;gap:16px"><div class="apui-field"><label  data-scope="field" data-part="label">Primary color</label><div class="apui-input is-focus"><span class="apui-color-swatch" style="background:#1f74bf"></span><span  data-scope="input" data-part="value" style="font-family:var(--apui-font-family-mono)">#1F74BF</span><span  data-scope="select" data-part="chevron"><svg class="apui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6" /></svg></span></div></div><div class="apui-field"><label  data-scope="field" data-part="label">Accent color</label><div class="apui-input"><span class="apui-color-swatch" style="background:#de9d16"></span><span  data-scope="input" data-part="value" style="font-family:var(--apui-font-family-mono)">#DE9D16</span><span  data-scope="select" data-part="chevron"><svg class="apui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6" /></svg></span></div></div><div class="apui-field" data-invalid><label  data-scope="field" data-part="label">Brand color</label><div class="apui-input"><span class="apui-color-swatch" style="background:#ffffff"></span><span  data-scope="input" data-part="value" style="font-family:var(--apui-font-family-mono)">#ZZ1234</span><span  data-scope="select" data-part="chevron"><svg class="apui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6" /></svg></span></div><span  data-scope="field" data-part="error"><svg class="apui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10" /> <line x1="12" x2="12" y1="8" y2="12" /> <line x1="12" x2="12.01" y1="16" y2="16" /></svg>Enter a 6-digit hex value.</span></div></div></section><section class="demo-sec"><h3 class="demo-h">Popover</h3><div class="apui-color-picker" role="dialog" aria-label="Choose a color"><div  data-scope="color-picker" data-part="area" style="--apui-_hue:#0077ff"><span  data-scope="color-picker" data-part="cursor" style="left:78%;top:28%;background:#1f74bf"></span></div><div  data-scope="color-picker" data-part="slider" data-kind="hue" role="slider" aria-label="Hue"><span  data-scope="color-picker" data-part="cursor" style="left:58%;background:#0077ff"></span></div><div  data-scope="color-picker" data-part="slider" data-kind="alpha" role="slider" aria-label="Opacity"><span  data-scope="color-picker" data-part="cursor" style="left:100%;background:#1f74bf"></span></div><div  data-scope="color-picker" data-part="row"><div style="width:76px"><div class="apui-select"><div class="apui-input" data-size="sm" role="combobox" aria-expanded="false"><span  data-scope="input" data-part="value">HEX</span><span  data-scope="select" data-part="chevron"><svg class="apui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6" /></svg></span></div></div></div><div style="flex:1;min-width:0"><div class="apui-input" data-size="sm"><span  data-scope="input" data-part="value">#1F74BF</span></div></div><div style="width:58px"><div class="apui-input" data-size="sm"><span  data-scope="input" data-part="value">100%</span></div></div><button class="apui-button" data-variant="ghost" data-color="neutral" data-size="sm" data-icon-only aria-label="Pick from screen"><svg class="apui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m2 22 1-1h3l9-9" /> <path d="M3 21v-3l9-9" /> <path d="m15 6 3.4-3.4a2.1 2.1 0 1 1 3 3L18 9l.4.4a2.1 2.1 0 1 1-3 3l-3.8-3.8a2.1 2.1 0 1 1 3-3l.4.4Z" /></svg></button></div><div  data-scope="field" data-part="hint">Brand swatches</div><div  data-scope="color-picker" data-part="swatches"><span class="apui-color-swatch" role="option" style="background:#1f74bf" aria-selected="true"></span><span class="apui-color-swatch" role="option" style="background:#0b9488"></span><span class="apui-color-swatch" role="option" style="background:#1f6f3d"></span><span class="apui-color-swatch" role="option" style="background:#de9d16"></span><span class="apui-color-swatch" role="option" style="background:#e88761"></span><span class="apui-color-swatch" role="option" style="background:#c92f33"></span><span class="apui-color-swatch" role="option" style="background:#91256c"></span><span class="apui-color-swatch" role="option" style="background:#23272b"></span></div></div></section></div></div>
</body>
</html>
