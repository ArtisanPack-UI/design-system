<!doctype html>

<meta charset="utf-8">

<style>
html,body{margin:0;background:var(--apui-surface-page)}
.demo{padding:24px;display:grid;gap:28px}
.demo-sec{display:grid;gap:12px}
.demo-h{margin:0;font-size:11px;line-height:16px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--apui-text-muted)}
.demo-row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.demo-row.top{align-items:flex-start}
.demo-matrix{display:grid;gap:10px 12px;align-items:center;justify-items:start}
.demo-k{font-size:12px;line-height:16px;color:var(--apui-text-muted);font-family:var(--apui-font-family-mono)}
.demo-surfaces{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.demo-tile{border-radius:var(--apui-radius-lg);padding:16px;display:grid;gap:10px;align-content:start;border:1px solid var(--apui-border-muted);min-width:0}
.demo-tile[data-s=canvas]{background:var(--apui-surface-page)}
.demo-tile[data-s=default]{background:var(--apui-surface-default)}
.demo-tile[data-s=sunken]{background:var(--apui-surface-sunken)}
.demo-backdrop{position:relative;overflow:hidden;border-radius:var(--apui-radius-lg);background:var(--apui-surface-page);border:1px solid var(--apui-border-muted)}
.demo-backdrop>.blob{position:absolute;pointer-events:none}
.demo-backdrop>.content{position:relative;padding:16px;display:grid;gap:10px}
.demo-cols{display:grid;gap:16px}
</style>
</head>

1 9 9" /></svg><span  data-scope="button" data-part="label">Clear</span></button></div><span  data-scope="signature" data-part="placeholder">Sign above the line</span></div><span  data-scope="field" data-part="hint">Olivia Rhye · Nov 7, 2026</span></div></section><section class="demo-sec"><h3 class="demo-h">Type · empty and required</h3><div style="display:grid;gap:8px"><div class="apui-tabs" data-size="sm"><div  data-scope="tabs" data-part="list" role="tablist"><button  data-scope="tabs" data-part="trigger" role="tab" aria-selected="false">Draw</button><button  data-scope="tabs" data-part="trigger" role="tab" aria-selected="true">Type</button><button  data-scope="tabs" data-part="trigger" role="tab" aria-selected="false">Upload</button></div></div><div class="apui-signature" role="img" aria-label="Signature pad"><span  data-scope="signature" data-part="line"></span><span  data-scope="signature" data-part="x">×</span><span  data-scope="signature" data-part="typed">Olivia Rhye</span><span  data-scope="signature" data-part="placeholder">Sign above the line</span></div><div class="apui-field" data-invalid><label  data-scope="field" data-part="label">Signature</label><div class="apui-signature" data-invalid role="img" aria-label="Signature pad"><span  data-scope="signature" data-part="line"></span><span  data-scope="signature" data-part="x">×</span><span  data-scope="signature" data-part="placeholder">Sign above the line</span></div><span  data-scope="field" data-part="error"><svg class="apui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10" /> <line x1="12" x2="12" y1="8" y2="12" /> <line x1="12" x2="12.01" y1="16" y2="16" /></svg>Sign to accept the lease.</span></div></div></section></div></div>

</html>
