<style>
html,body{margin:0;background:var(--apui-surface-page)}
.demo{padding:24px;display:grid;gap:28px}
.demo-sec{display:grid;gap:12px}
.demo-h{margin:0;font-size:11px;line-height:16px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--apui-text-muted)}
.demo-row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.demo-row.top{align-items:flex-start}
.demo-matrix{display:grid;gap:10px 12px;align-items:center;justify-items:start}
.demo-k{font-size:12px;line-height:16px;color:var(--apui-text-muted);font-family:var(--apui-font-family-mono)}
.demo-surfaces{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.demo-tile{border-radius:var(--apui-radius-lg);padding:16px;display:grid;gap:10px;align-content:start;border:1px solid var(--apui-border-muted);min-width:0}
.demo-tile[data-s=canvas]{background:var(--apui-surface-page)}
.demo-tile[data-s=default]{background:var(--apui-surface-default)}
.demo-tile[data-s=sunken]{background:var(--apui-surface-sunken)}
.demo-backdrop{position:relative;overflow:hidden;border-radius:var(--apui-radius-lg);background:var(--apui-surface-page);border:1px solid var(--apui-border-muted)}
.demo-backdrop>.blob{position:absolute;pointer-events:none}
.demo-backdrop>.content{position:relative;padding:16px;display:grid;gap:10px}
.demo-cols{display:grid;gap:16px}

<div class="demo"><section class="demo-sec"><h3 class="demo-h">End drawer on the scrim · bottom sheet (mobile)</h3><div style="display:grid;grid-template-columns:1fr 360px;gap:16px"><div class="apui-scrim" style="border-radius:var(--apui-radius-lg);height:640px;display:flex;justify-content:flex-end;overflow:hidden"><aside class="apui-drawer" role="dialog" aria-labelledby="dt"><div  data-scope="drawer" data-part="header"><div style="flex:1"><h2  data-scope="drawer" data-part="title" id="dt">Filters</h2><p  data-scope="drawer" data-part="description">218 properties match</p></div><button class="apui-button" data-variant="ghost" data-color="neutral" data-size="sm" data-icon-only aria-label="Close"><svg class="apui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18" /> <path d="m6 6 12 12" /></svg></button></div><div  data-scope="drawer" data-part="body"><div class="apui-field"><label  data-scope="field" data-part="label">Location</label><div class="apui-input"><span  data-scope="input" data-part="icon"><svg class="apui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0" /> <circle cx="12" cy="10" r="3" /></svg></span><span  data-scope="input" data-part="value">Barcelona, Spain</span></div></div><div class="apui-field"><label  data-scope="field" data-part="label">Property type</label><div class="apui-select"><div class="apui-input" role="combobox" aria-expanded="false"><span  data-scope="input" data-part="value">Any type</span><span  data-scope="select" data-part="chevron"><svg class="apui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6" /></svg></span></div></div></div><fieldset class="apui-checkbox-group"><legend  data-scope="checkbox-group" data-part="legend">Status</legend><div  data-scope="checkbox-group" data-part="items"><label class="apui-choice" data-type="checkbox" data-state="checked"><span  data-scope="choice" data-part="box"><input type="checkbox" checked><svg class="apui-icon" data-scope="choice" data-part="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5" /></svg><svg class="apui-icon" data-scope="choice" data-part="mixed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14" /></svg></span><span  data-scope="choice" data-part="label">Active</span></label><label class="apui-choice" data-type="checkbox" data-state="unchecked"><span  data-scope="choice" data-part="box"><input type="checkbox"><svg class="apui-icon" data-scope="choice" data-part="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5" /></svg><svg class="apui-icon" data-scope="choice" data-part="mixed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14" /></svg></span><span  data-scope="choice" data-part="label">Pending</span></label><label class="apui-choice" data-type="checkbox" data-state="unchecked"><span  data-scope="choice" data-part="box"><input type="checkbox"><svg class="apui-icon" data-scope="choice" data-part="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5" /></svg><svg class="apui-icon" data-scope="choice" data-part="mixed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14" /></svg></span><span  data-scope="choice" data-part="label">Sold</span></label></div></fieldset><label class="apui-toggle" data-state="on"><span  data-scope="toggle" data-part="track"><input type="checkbox" role="switch" checked><span  data-scope="toggle" data-part="thumb"></span></span><span><span  data-scope="toggle" data-part="label">Only show pet friendly</span></span></label></div><div  data-scope="drawer" data-part="footer"><button class="apui-button" data-variant="ghost" data-color="neutral"><span  data-scope="button" data-part="label">Reset</span></button><button class="apui-button" data-variant="solid"><span  data-scope="button" data-part="label">Show 218 results</span></button></div></aside></div><div class="apui-scrim" style="border-radius:var(--apui-radius-lg);height:640px;display:flex;align-items:flex-end;overflow:hidden"><div class="apui-sheet" role="dialog" aria-label="Share"><div  data-scope="sheet" data-part="handle"></div><h3 class="apui-heading" data-level="5">Share listing</h3><div class="demo-row" style="margin-top:12px"><button class="apui-button" data-variant="outline" data-color="neutral"><svg class="apui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="14" height="14" x="8" y="8" rx="2" ry="2" /> <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2" /></svg><span  data-scope="button" data-part="label">Copy link</span></button><button class="apui-button" data-variant="outline" data-color="neutral"><svg class="apui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="20" height="16" x="2" y="4" rx="2" /> <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7" /></svg><span  data-scope="button" data-part="la
