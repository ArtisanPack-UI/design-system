<style>
html,body{margin:0;background:var(--apui-surface-page)}
.demo{padding:24px;display:grid;gap:28px}
.demo-sec{display:grid;gap:12px}
.demo-h{margin:0;font-size:11px;line-height:16px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--apui-text-muted)}
.demo-row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}

.demo-backdrop>.blob{position:absolute;pointer-events:none}
.demo-backdrop>.content{position:relative;padding:16px;display:grid;gap:10px}
.demo-cols{display:grid;gap:16px}

hidden="true"><circle cx="12" cy="12" r="10" /> <line x1="12" x2="12" y1="8" y2="12" /> <line x1="12" x2="12.01" y1="16" y2="16" /></svg>That date doesn’t exist.</span></div></div></section><section class="demo-sec"><h3 class="demo-h">Calendar popover · range, today, disabled, hover</h3><div class="apui-date-picker" role="dialog" aria-label="Choose dates"><div  data-scope="date-picker" data-part="header"><button class="apui-button" data-variant="ghost" data-color="neutral" data-size="sm" data-icon-only aria-label="Previous month"><svg class="apui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" data-mirror><path d="m15 18-6-6 6-6" /></svg></button><span  data-scope="date-picker" data-part="month">November 2026</span><button class="apui-button" data-variant="ghost" data-color="neutral" data-size="sm" data-icon-only aria-label="Next month"><svg class="apui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" data-mirror><path d="m9 18 6-6-6-6" /></svg></button></div><div  data-scope="date-picker" data-part="grid" role="grid"><span  data-scope="date-picker" data-part="weekday" aria-hidden="true">Mo</span><span  data-scope="date-picker" data-part="weekday" aria-hidden="true">Tu</span><span  data-scope="date-picker" data-part="weekday" aria-hidden="true">We</span><span  data-scope="date-picker" data-part="weekday" aria-hidden="true">Th</span><span  data-scope="date-picker" data-part="weekday" aria-hidden="true">Fr</span><span  data-scope="date-picker" data-part="weekday" aria-hidden="true">Sa</span><span  data-scope="date-picker" data-part="weekday" aria-hidden="true">Su</span><span  data-scope="date-picker" data-part="day" role="gridcell" data-outside>26</span><span  data-scope="date-picker" data-part="day" role="gridcell" data-outside>27</span><span  data-scope="date-picker" data-part="day" role="gridcell" data-outside>28</span><span  data-scope="date-picker" data-part="day" role="gridcell" data-outside>29</span><span  data-scope="date-picker" data-part="day" role="gridcell" data-outside>30</span><span  data-scope="date-picker" data-part="day" role="gridcell" data-outside>31</span><span  data-scope="date-picker" data-part="day" role="gridcell">1</span><span  data-scope="date-picker" data-part="day" role="gridcell" data-disabled>2</span><span  data-scope="date-picker" data-part="day" role="gridcell" data-disabled>3</span><span  data-scope="date-picker" data-part="day" role="gridcell">4</span><span  data-scope="date-picker" data-part="day" role="gridcell">5</span><span  data-scope="date-picker" data-part="day" role="gridcell">6</span><span  data-scope="date-picker" data-part="day" role="gridcell" data-today>7</span><span  data-scope="date-picker" data-part="day" role="gridcell">8</span><span  data-scope="date-picker" data-part="day" role="gridcell">9</span><span  data-scope="date-picker" data-part="day" role="gridcell">10</span><span  data-scope="date-picker" data-part="day" role="gridcell">11</span><span  data-scope="date-picker" data-part="day" role="gridcell" data-selected>12</span><span  data-scope="date-picker" data-part="day" role="gridcell" data-in-range>13</span><span  data-scope="date-picker" data-part="day" role="gridcell" data-in-range>14</span><span  data-scope="date-picker" data-part="day" role="gridcell" data-in-range>15</span><span  data-scope="date-picker" data-part="day" role="gridcell" data-in-range>16</span><span  data-scope="date-picker" data-part="day" role="gridcell" data-in-range>17</span><span  data-scope="date-picker" data-part="day" role="gridcell" data-selected>18</span><span  data-scope="date-picker" data-part="day" role="gridcell">19</span><span  data-scope="date-picker" data-part="day" role="gridcell">20</span><span  data-scope="date-picker" data-part="day" role="gridcell">21</span><span  data-scope="date-picker" data
