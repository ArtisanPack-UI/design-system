<!-- @dsCard group="Overlays" height=400 subtitle="Anchored, non-modal panel with interactive content" -->
<!doctype html>
<html>
<head>
<link rel="stylesheet" href="../../tokens/tokens.css">
<link rel="stylesheet" href="../../css/components.css">
<script>document.documentElement.dataset.theme=new URLSearchParams(location.search).get("theme")||document.documentElement.dataset.theme||"light"</script>

<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
html,body{margin:0;background:var(--apui-surface-page)}
.demo{padding:24px;display:grid;gap:28px}
.demo-sec{display:grid;gap:12px}
.demo-h{margin:0;font-size:11px;line-height:16px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--apui-text-muted)}
.demo-row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.demo-row.top{align-items:flex-start}
.demo-matrix{display:grid;gap:10px 12px;align-items:center;justify-items:start}
.demo-k{font-size:12px;line-height:16px;color:var(--apui-text-muted);font-family:var(--apui-font-family-mono)}
.demo-surfaces{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.demo-tile{border-radius:var(--apui-radius-lg);padding:16px;display:grid;gap:10px;align-content:start;border:1px solid var(--apui-border-muted);min-width:0}
.demo-tile[data-s=canvas]{background:var(--apui-surface-page)}
.demo-tile[data-s=default]{background:var(--apui-surface-default)}
.demo-tile[data-s=sunken]{background:var(--apui-surface-sunken)}
.demo-backdrop{position:relative;overflow:hidden;border-radius:var(--apui-radius-lg);background:var(--apui-surface-page);border:1px solid var(--apui-border-muted)}
.demo-backdrop>.blob{position:absolute;pointer-events:none}
.demo-backdrop>.content{position:relative;padding:16px;display:grid;gap:10px}
.demo-cols{display:grid;gap:16px}
</style>
</head>
<body class="ap">
<div class="demo"><div class="demo-cols" style="grid-template-columns:repeat(2,minmax(0,1fr));align-items:start"><section class="demo-sec"><h3 class="demo-h">Below a trigger</h3><div style="display:grid;gap:10px;justify-items:start"><button class="apui-button is-active" data-variant="solid" data-size="sm"><svg class="apui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18" cy="5" r="3" /> <circle cx="6" cy="12" r="3" /> <circle cx="18" cy="19" r="3" /> <line x1="8.59" x2="15.42" y1="13.51" y2="17.49" /> <line x1="15.41" x2="8.59" y1="6.51" y2="10.49" /></svg><span  data-scope="button" data-part="label">Share</span></button><div class="apui-popover" data-placement="bottom" role="dialog" aria-labelledby="p1"><span  data-scope="popover" data-part="arrow"></span><h3  data-scope="popover" data-part="title" id="p1">Share report</h3><div class="apui-copy-field"><div class="apui-input" data-readonly data-size="sm"><span  data-scope="input" data-part="value">horizon.app/r/q4-income</span></div><button class="apui-button" data-variant="outline" data-color="neutral" data-size="sm"><svg class="apui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="14" height="14" x="8" y="8" rx="2" ry="2" /> <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2" /></svg><span  data-scope="button" data-part="label">Copy</span></button></div><div style="display:flex;justify-content:space-between;align-items:center"><span class="apui-avatar-group"><span class="apui-avatar" data-color="primary" data-size="xs" role="img" aria-label="OR">OR</span><span class="apui-avatar" data-color="success" data-size="xs" role="img" aria-label="PB">PB</span><span class="apui-avatar" data-color="info" data-size="xs" role="img" aria-label="LS">LS</span></span><span class="apui-text" data-size="xs" data-tone="muted">Marketing team can view</span></div></div></div></section><section class="demo-sec"><h3 class="demo-h">Above an info button</h3><div style="display:grid;gap:10px;justify-items:start"><div class="apui-popover" data-placement="top" style="width:260px"><span  data-scope="popover" data-part="arrow"></span><h3  data-scope="popover" data-part="title">What counts as a visit?</h3><p class="apui-text" data-size="sm" data-tone="muted">A unique person who opened the listing for at least 5 seconds, counted once a day.</p><a class="apui-link" data-standalone href="#">Learn more <svg class="apui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" data-mirror><path d="M5 12h14" /> <path d="m12 5 7 7-7 7" /></svg></a></div><button class="apui-button" data-variant="ghost" data-color="neutral" data-size="sm" data-icon-only aria-label="About visits"><svg class="apui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10" /> <path d="M12 16v-4" /> <path d="M12 8h.01" /></svg></button></div></section></div></div>
</body>
</html>
