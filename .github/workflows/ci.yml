name: CI

on:
  push:
    branches: [main, release/*]
  pull_request:
    branches: [main, release/*]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Stylelint
        run: npm run lint:css
      - name: Prettier
        run: npm run format:check

  type-check:
    name: Type check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run type-check

  test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The CSS cascade tests run in Chromium.
      - run: npx playwright install --with-deps chromium
      # Fails when the committed token outputs are stale (#19).
      - run: npm run build
      - run: npm test

  inventory:
    name: Inventory checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/inventory/package-lock.json
      - run: npm ci --prefix tools/inventory
      - run: npm test --prefix tools/inventory

  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint, type-check, test, inventory]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      # Action v2 is the line that supports Changesets CLI 3: it reads published
      # packages from CHANGESETS_OUTPUT instead of parsing "New tag:" from stdout.
      # npm auth comes from setup-node's registry-url plus NODE_AUTH_TOKEN; switch
      # to npm Trusted Publishing before #81 and drop the token.
      - name: Create release PR or publish
        uses: changesets/action@v2
        with:
          publish-script: npm run release
          pr-title: 'chore: version packages'
          commit-message: 'chore: version packages'
          create-github-releases: true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
